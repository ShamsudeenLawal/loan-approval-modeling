<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Approval Predictor</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='home.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <div class="card p-4">
        <div class="card-header">
          <h2>💰 Loan Approval Predictor</h2>
          <p class="text-muted">
            Enter customer details to predict loan eligibility
          </p>
        </div>

        <form action="{{ url_for('predict') }}" method="post">
          <div class="row">
            <!-- Left Column -->
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Gender</label>
                <select name="Gender" class="form-select" required>
                  <option disabled selected>Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Marital Status</label>
                <select name="Married" class="form-select" required>
                  <option disabled selected>Select</option>
                  <option value="No">Single</option>
                  <option value="Yes">Married</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Dependents</label>
                <select name="Dependents" class="form-select" required>
                  <option disabled selected>Select</option>
                  <option value="0">0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3+">3+</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Education</label>
                <select name="Education" class="form-select" required>
                  <option disabled selected>Select</option>
                  <option value="Graduate">Graduate</option>
                  <option value="Not Graduate">Not Graduate</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Self Employed</label>
                <select name="SelfEmployed" class="form-select" required>
                  <option disabled selected>Select</option>
                  <option value="Yes">Yes</option>
                  <option value="No">No</option>
                </select>
              </div>
            </div>

            <!-- Right Column -->
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Credit History</label>
                <select name="CreditHistory" class="form-select" required>
                  <option disabled selected>Select</option>
                  <option value="1.0">Good</option>
                  <option value="0.">Bad</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Property Area</label>
                <select name="PropertyArea" class="form-select" required>
                  <option disabled selected>Select</option>
                  <option value="Urban">Urban</option>
                  <option value="Semiurban">Semi-Urban</option>
                  <option value="Rural">Rural</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Loan Term (Months)</label>
                <select name="LoanAmountTerm" class="form-select" required>
                  <option disabled selected>Select</option>
                  <option value=12>12</option>
                  <option value=36>36</option>
                  <option value=60>60</option>
                  <option value=84>84</option>
                  <option value=120>120</option>
                  <option value=180>180</option>
                  <option value=240>240</option>
                  <option value=300>300</option>
                  <option value=360>360</option>
                  <option value=360>480</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Applicant Income</label>
                <input
                  type="number"
                  name="ApplicantIncome"
                  class="form-control"
                  placeholder="e.g. 5000"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Co-applicant Income</label>
                <input
                  type="number"
                  name="CoapplicantIncome"
                  class="form-control"
                  placeholder="e.g. 2000"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Loan Amount</label>
                <input
                  type="number"
                  name="LoanAmount"
                  class="form-control"
                  placeholder="e.g. 150000"
                  required
                />
              </div>
            </div>
          </div>

          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary">
              Predict Loan Status
            </button>
          </div>
        </form>

        {% if prediction_message %}
        <div
          class="result-box mt-4 {{ 'approved' if 'Approved' in prediction_message else 'rejected' }}"
        >
          {{ prediction_message }}
        </div>
        {% endif %}
      </div>
    </div>
  </body>
</html>
